
name: Build MPR SQUAD APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android Project ZIP
        run: |
          mkdir -p extracted
          ZIP=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          if [ -n "$ZIP" ]; then
            unzip -o "$ZIP" -d extracted
          fi

      - name: Build APK
        run: |
          PROJECT=$(find extracted . -name settings.gradle -o -name settings.gradle.kts | head -n 1)
          if [ -z "$PROJECT" ]; then
            echo "Android Gradle project not found"
            exit 1
          fi
          cd "$(dirname "$PROJECT")"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MPR-SQUAD-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
